[project]
name = "leadflow"
version = "0.2.0"
description = "Human-reviewed lead research and outreach agent"
requires-python = ">=3.13,<3.14"
dependencies = [
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-google-genai>=4,<5",
  "langgraph>=1,<2",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["playwright>=1.65,<2"]
